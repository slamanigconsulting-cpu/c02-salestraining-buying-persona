blocks: [
{h: "Das Buygrid-Modell", p: ["Robinson, Faris und Wind (1967) verstehen den organisationalen Einkauf als Entscheidungsprozess. Ihre zentrale Erkenntnis lautet, dass das Kaufverhalten stärker von der Kaufsituation als von der Produktart abhängt. Sie verbinden drei Kaufklassen mit acht Kaufphasen zu einer Matrix, dem Buygrid. Jede Zelle zeigt, wer beteiligt ist, welche Information benötigt wird und wie der Anbieter sie liefern kann."]},
{h: "Die acht Kaufphasen", list: ["1 Bedarf erkennen", "2 Art und Menge bestimmen", "3 Spezifikation beschreiben (häufig als Lastenheft)", "4 Lieferanten suchen und prüfen", "5 Angebote einholen und analysieren", "6 Angebote bewerten und Lieferant wählen", "7 Bestellabwicklung festlegen", "8 Leistung bewerten"], p2: ["Die Phasen sind ein analytisches Hilfsmittel. In der Praxis fallen Phasen zusammen, werden übersprungen oder mehrfach durchlaufen."]},
{h: "Kaufklassen und kritische Phasen", p: ["Beim Erstkauf werden alle Phasen intensiv durchlaufen, entscheidend sind die frühen Phasen, in denen Lösungsweg und Anforderungen festgelegt werden. Beim modifizierten Wiederkauf liegt das Gewicht auf Lieferantensuche und Angebotsbewertung. Beim reinen Wiederkauf entfallen die mittleren Phasen, es zählt fast nur die Leistungsbewertung (Backhaus & Voeth, 2014)."]},
{h: "Festlegungsfortschritt", p: ["Mit jeder abgeschlossenen Phase verengt sich der Kreis der infrage kommenden Anbieter (creeping commitment). Der etablierte Anbieter profitiert im reinen Wiederkauf von seiner Position. Ein neuer Anbieter hat seine größte Chance im Erstkauf oder im modifizierten Wiederkauf. Er steigt möglichst früh ein oder weckt begründete Zweifel an der Routine und verwandelt so einen reinen in einen modifizierten Wiederkauf (Kleinaltenkamp & Saab, 2021)."]},
{h: "Phasen, Rollen und Grenzen des Modells", p: ["In den frühen Phasen sind Initiator, Anwender und Fachpromotor aktiv, in der Spezifikation die Einflussnehmer aus Technik und IT. In der Lieferantensuche treten Einkäufer und Gatekeeper hervor, in der Auswahlphase Entscheider und Machtpromotor.", "Das Buygrid unterstellt einen rationalen, geordneten Ablauf und erfasst persönliche Motive und Macht nur unzureichend. Es ist beschreibend und sagt den Ausgang einer Entscheidung nicht voraus. Als Landkarte bleibt es wertvoll, die reale Journey verläuft flexibler (Steward et al., 2019)."]}
],
terms: [
["Creeping commitment", "Schrittweiser Festlegungsfortschritt: Je weiter der Prozess voranschreitet, desto geringer die Chance eines neuen Anbieters. Wer erst einsteigt, wenn das Lastenheft auf einen Wettbewerber zugeschnitten ist, kommt meist zu spät."],
["Lastenheft", "Schriftliche Beschreibung der Anforderungen des Kunden. Wer die Spezifikation mitprägt, verschafft sich einen Vorteil."],
["Hinweise auf die Kaufklasse", "Erstkauf: neues Projektteam, offenes Lastenheft, hoher Informationsbedarf. Modifizierter Wiederkauf: bestehender Lieferant, geänderte Anforderungen, Ausschreibung. Reiner Wiederkauf: feste Bestellroutinen, wenig Gesprächsinteresse."]
],
questions: [
{q: "Welche zentrale Erkenntnis formulieren Robinson, Faris und Wind (1967)?", a: ["Das Kaufverhalten hängt stärker von der Kaufsituation als von der Produktart ab", "Das Kaufverhalten hängt vor allem vom Preis ab", "Investitionsgüter werden immer im Erstkauf beschafft", "Alle Kaufphasen werden bei jedem Kauf gleich intensiv durchlaufen"], why: "Die Kaufsituation, also die Kaufklasse, prägt den Ablauf stärker als die Art des Produkts."},
{q: "Was verbindet das Buygrid-Modell?", a: ["Drei Kaufklassen mit acht Kaufphasen", "Fünf Buying-Center-Rollen mit vier Promotortypen", "Sechs Kaufaufgaben mit drei Kaufklassen", "Vier Einflussebenen mit acht Kaufphasen"], why: "Das Buygrid ist eine Matrix aus drei Kaufklassen und acht Kaufphasen."},
{q: "Welche Phase wird auch beim reinen Wiederkauf intensiv durchlaufen?", a: ["Leistung bewerten", "Spezifikation beschreiben", "Lieferanten suchen und prüfen", "Angebote einholen und analysieren"], why: "Beim reinen Wiederkauf entfallen die mittleren Phasen. Die Leistungsbewertung entscheidet, ob der bestehende Lieferant bleibt."},
{q: "Was beschreibt der Begriff creeping commitment?", a: ["Mit jeder abgeschlossenen Phase verengt sich der Kreis der infrage kommenden Anbieter", "Der Kunde bindet sich vertraglich schrittweise an mehrere Anbieter", "Die Zahl der Beteiligten im Buying Center wächst mit jeder Phase", "Der Preis sinkt mit jeder weiteren Verhandlungsrunde"], why: "Der Festlegungsfortschritt verringert mit jeder Phase die Chance eines neuen Anbieters, noch berücksichtigt zu werden."},
{q: "Welche Phasen sind beim Erstkauf besonders kritisch?", a: ["Die frühen Phasen, in denen Lösungsweg und Anforderungen festgelegt werden", "Ausschließlich die Bestellabwicklung", "Ausschließlich die Leistungsbewertung", "Die Phasen nach Vertragsabschluss"], why: "Wer in den frühen Phasen mitgestaltet, prägt das spätere Lastenheft."},
{q: "Worauf liegt beim modifizierten Wiederkauf das Gewicht?", a: ["Auf der Lieferantensuche und der Angebotsbewertung", "Auf der Bedarfserkennung", "Auf der Bestellabwicklung", "Auf der Bestimmung von Art und Menge"], why: "Der Kunde prüft, ob sich ein Wechsel oder eine Anpassung lohnt. Lieferantensuche und Angebotsbewertung gewinnen dadurch an Bedeutung."},
{q: "Wie kann ein neuer Anbieter einen reinen Wiederkauf aufbrechen?", a: ["Indem er begründete Zweifel an der Routine weckt und einen konkreten Mehrwert aufzeigt", "Indem er erst in der Angebotsphase einsteigt", "Indem er das bestehende Lastenheft unverändert übernimmt", "Indem er ausschließlich mit dem Einkauf spricht"], why: "Gelingt es, Zweifel an der Routine zu wecken, verschiebt sich die Situation zum modifizierten Wiederkauf, und die mittleren Phasen öffnen sich erneut."},
{q: "Welche Hinweise sprechen für einen Erstkauf?", a: ["Ein neu gebildetes Projektteam, ein offenes Lastenheft und hoher Informationsbedarf", "Feste Bestellroutinen und geringes Gesprächsinteresse", "Ein bestehender Lieferant und geänderte Anforderungen", "Ein Rahmenvertrag mit automatischer Verlängerung"], why: "Diese Merkmale deuten auf eine neue Aufgabe hin. Feste Routinen sprechen für einen reinen Wiederkauf, geänderte Anforderungen beim bestehenden Lieferanten für einen modifizierten Wiederkauf."},
{q: "Wer gibt in der Phase Spezifikation beschreiben typischerweise den Ausschlag?", a: ["Einflussnehmer aus Technik und IT in der Rolle des Fachpromotors", "Der Einkäufer als Prozesspromotor", "Der Entscheider als Machtpromotor", "Der Gatekeeper als Beziehungspromotor"], why: "In der Spezifikation prägen Technik und IT das Lastenheft. Wer hier nur mit dem Einkauf spricht, verfehlt den Fachpromotor."},
{q: "Welche Aussage beschreibt eine Grenze des Buygrid-Modells?", a: ["Es unterstellt einen rationalen, geordneten Ablauf und erfasst persönliche Motive und Macht nur unzureichend", "Es berücksichtigt keine Kaufklassen", "Es gilt ausschließlich für Konsumgüter", "Es sagt den Ausgang einer konkreten Entscheidung zuverlässig voraus"], why: "Das Modell ist beschreibend und nicht vorhersagend. Persönliche Motive und Machtverhältnisse ergänzen das Rollen- und Promotorenmodell aus Modul 2."}
]
},
{
id: "m4", nr: 4, title: "Von der Zielgruppe zur Buying Persona",
lead: "Die Buying Persona gibt den Rollen im Buying Center ein Gesicht. Im Mittelpunkt steht die Methodik, mit der eine Persona fundiert entsteht.",
blocks: [
{h: "Konkretisierungsstufen", p: ["Der Weg führt von der Zielgruppe über das Marktsegment und das Ideal Customer Profile zur Buying Persona. Mit jeder Stufe steigt die Detailtiefe, der Blick wandert vom Markt über das Unternehmen zum Menschen. Das Ideal Customer Profile beschreibt das ideale Kundenunternehmen, die Persona die typische Ansprechperson mit Zielen und Verhalten (Dach, 2023; Selent, 2023)."]},
{h: "Herkunft und Datenbasis", p: ["Der Persona-Begriff stammt aus der Softwareentwicklung (Cooper, 1999). Adele Revella (2015) übertrug ihn als Buyer Persona auf den B2B-Kontext.", "Für die Datengewinnung gibt es drei Wege: die Ad-hoc- oder Proto-Persona aus internem Wissen (schnell, beruht auf Annahmen), die interviewbasierte Persona (Standard) und die datenbasierte Persona aus Nutzungs- und Verhaltensdaten (Salminen et al., 2021). Eine Persona ohne Datengrundlage ist reine Fiktion."]},
{h: "Interviews und die Five Rings of Buying Insight", p: ["Bewährt haben sich sechs bis zehn Interviews von 20 bis 40 Minuten, besonders mit kürzlich gewonnenen Kunden (Dach, 2023). Revella (2015) strukturiert sie entlang von fünf Erkenntnisfeldern:"], list: ["Priority Initiative: Was bringt den Kunden dazu, jetzt zu handeln?", "Success Factors: Welches Ergebnis erwartet er, betrieblich und persönlich?", "Perceived Barriers: Was hält ihn von Lösung oder Anbieter ab?", "Decision Criteria: Welche Eigenschaften vergleicht er, was gibt den Ausschlag?", "Buyer's Journey: Wie läuft die Entscheidung ab, wer wirkt mit?"], p2: ["Nachfragen ist zentral. Hinter der Aussage, der Preis sei entscheidend gewesen, verbirgt sich oft das Motiv, sich gegen eine Fehlentscheidung abzusichern."]},
{h: "Erstellung, Steckbrief und Pflege", p: ["Die Erstellung folgt sieben Schritten: Ziel und Umfang festlegen, internes Wissen sammeln, Kunden interviewen, Muster erkennen, Steckbrief erstellen, Relevanz absichern, anwenden und aktualisieren. Weniger als zehn Personas haben sich bewährt, eine Überprüfung ist etwa alle zwei bis drei Jahre sinnvoll (Dach, 2023).", "Der Steckbrief legt den Schwerpunkt auf Motive, Pain Points, Entscheidungskriterien, Hürden, Kanalpräferenzen und die Rolle im Buying Center. Demografische Angaben allein sagen wenig über das Kaufverhalten aus (Revella, 2015)."]},
{h: "Datenbasierte und KI-gestützte Personas", p: ["Datenbasierte Personas bleiben aktueller, weil sie sich mit neuen Daten anpassen lassen. Neuere Ansätze erzeugen Persona-Beschreibungen mit Sprachmodellen (Jung et al., 2025). Das Risiko liegt in der Verzerrung: KI-Modelle übernehmen die Schieflagen ihrer Trainingsdaten (Salminen et al., 2021). Da Kaufentscheidungen von Gruppen getroffen werden, ist die Persona mit der Buying-Center-Perspektive zu verbinden."]}
],
terms: [
["Ideal Customer Profile (ICP)", "Idealtypisches Kundenunternehmen nach Firmenmerkmalen, etwa ein Hersteller mit mehreren Werken und veralteter Fertigungs-IT."],
["Proto-Persona", "Erster Entwurf aus dem Wissen von Vertrieb, Marketing und Service. Schnell und günstig, beschreibt den Kunden aber nur von außen und muss später überprüft werden."],
["Buying Insight", "Die eigentliche Motivation oder Barriere, die das Kaufverhalten einer Persona erklärt."],
["Clustering", "Statistisches Verfahren, das in großen Datenmengen Gruppen ähnlicher Fälle bildet. Es dient der reproduzierbaren Bildung datenbasierter Personas."]
],
questions: [
{q: "In welcher Reihenfolge steigt die Detailtiefe vom Markt zur Person?", a: ["Zielgruppe, Marktsegment, Ideal Customer Profile, Buying Persona", "Buying Persona, Ideal Customer Profile, Marktsegment, Zielgruppe", "Marktsegment, Zielgruppe, Buying Persona, Ideal Customer Profile", "Ideal Customer Profile, Zielgruppe, Buying Persona, Marktsegment"], why: "Mit jeder Stufe wird die Beschreibung konkreter, vom groben Markt über das ideale Kundenunternehmen bis zur einzelnen Ansprechperson."},
{q: "Was beschreibt das Ideal Customer Profile?", a: ["Das idealtypische Kundenunternehmen nach Firmenmerkmalen", "Die typische Ansprechperson mit ihren Motiven", "Den gesamten Markt nach wenigen Merkmalen", "Den Kunden mit dem höchsten Umsatz im Vorjahr"], why: "Das Ideal Customer Profile beschreibt das Unternehmen, die Buying Persona die handelnde Person in diesem Unternehmen."},
{q: "Woher stammt der Persona-Begriff ursprünglich?", a: ["Aus der Softwareentwicklung (Alan Cooper)", "Aus der Werbepsychologie der 1950er-Jahre", "Aus der Organisationssoziologie (Max Weber)", "Aus dem Key Account Management"], why: "Cooper (1999) beschrieb fiktive Nutzerfiguren für Entwicklungsteams. Revella (2015) übertrug den Begriff auf Marketing und Vertrieb im B2B."},
{q: "Was kennzeichnet eine Ad-hoc- oder Proto-Persona?", a: ["Sie entsteht schnell aus internem Wissen, beruht aber auf Annahmen und ist später zu überprüfen", "Sie beruht auf mindestens zehn ausführlichen Kundeninterviews", "Sie wird automatisch aus CRM-Daten erzeugt", "Sie gilt als belastbarster Weg der Datengewinnung"], why: "Die Proto-Persona eignet sich als erster Entwurf. Sie beschreibt den Kunden nur von außen."},
{q: "Welche Befragten sind für Persona-Interviews besonders aufschlussreich?", a: ["Kürzlich gewonnene Kunden", "Kunden, die seit über zehn Jahren keinen Kauf getätigt haben", "Ausschließlich Mitarbeitende des eigenen Vertriebs", "Zufällig ausgewählte Personen ohne Kaufbezug"], why: "Bei kürzlich gewonnenen Kunden ist die Erinnerung an den Entscheidungsprozess noch frisch (Dach, 2023)."},
{q: "Welcher der Five Rings fragt, was den Kunden dazu bringt, jetzt zu handeln statt beim Status quo zu bleiben?", a: ["Priority Initiative", "Success Factors", "Decision Criteria", "Buyer's Journey"], why: "Die Priority Initiative erfasst den Auslöser der Kaufentscheidung."},
{q: "Ein Kunde berichtet, er habe gezögert, weil er eine aufwendige Integration befürchtete. Welchem Erkenntnisfeld ist diese Aussage zuzuordnen?", a: ["Perceived Barriers", "Priority Initiative", "Success Factors", "Decision Criteria"], why: "Perceived Barriers beschreiben, was den Kunden davon abhält, eine Lösung oder einen Anbieter zu wählen."},
{q: "Worauf liegt der Schwerpunkt eines belastbaren Persona-Steckbriefs?", a: ["Auf Motiven, Pain Points und Entscheidungskriterien", "Auf Alter, Familienstand und Hobbys", "Auf einem möglichst realistischen Foto", "Auf der Zahl der Mitarbeitenden des Kundenunternehmens"], why: "Zwei Personen mit gleichem Alter und Beruf können sich im Kaufverhalten deutlich unterscheiden. Entscheidend sind die kaufrelevanten Merkmale (Revella, 2015)."},
{q: "Wie viele Personas haben sich in der Praxis bewährt?", a: ["Weniger als zehn", "Eine einzige für alle Rollen", "Mindestens 25", "Eine pro Kunde"], why: "Bei mehr Personas wird der Aufwand für eine differenzierte Ansprache zu groß (Dach, 2023)."},
{q: "Welches Risiko bringen KI-gestützte Personas besonders mit sich?", a: ["Verzerrungen aus den Trainingsdaten werden in die Personas übernommen", "Sie lassen sich nicht mehr aktualisieren", "Sie benötigen zwingend Interviews mit allen Kunden", "Sie sind auf Konsumgütermärkte beschränkt"], why: "KI-Modelle bilden die Verzerrungen ihrer Trainingsdaten ab. Ergebnisse sind daher kritisch zu prüfen (Salminen et al., 2021)."}
]
},
{
id: "m5", nr: 5, title: "Brücke in den Vertrieb",
lead: "Modul 5 führt die Bausteine der Module 1 bis 4 zusammen und verbindet sie mit Buyer Enablement, Qualifizierung und Value Selling.",
blocks: [
{h: "Der rote Faden", p: ["Jedes Modul beantwortet eine eigene Frage: wer mitentscheidet und intern antreibt (Modul 2), wie neu die Situation ist und in welcher Phase sie steht (Modul 1 und 3), was die einzelne Ansprechperson bewegt (Modul 4). Wer das Buying Center kennt, die Phase aber nicht, spricht die richtigen Personen zur falschen Zeit an. Wer die Phase kennt, die Motive aber nicht, liefert die falschen Argumente."]},
{h: "Buyer Enablement", p: ["Da Käufer sich weitgehend selbst informieren, geht es darum, ihnen das Kaufen zu erleichtern (Gartner, o. J.). Buyer Enablement besteht aus präskriptiven Empfehlungen und praktischer Unterstützung wie Rechnern, Checklisten oder Vergleichshilfen (Toman et al., 2017). Für jede der sechs Kaufaufgaben gibt es passende Angebote, etwa Kriterienlisten für die Anforderungsdefinition oder Argumentationshilfen für die Konsensbildung."]},
{h: "Qualifizierung mit BANT und MEDDIC", p: ["BANT prüft Budget, Entscheidungsbefugnis (Authority), Bedarf (Need) und Zeithorizont (Timeline). MEDDIC, 1996 bei PTC entstanden, umfasst sechs Komponenten, die direkt an die früheren Module anschließen:"], list: ["Metrics: messbarer Nutzen, verbunden mit den Erfolgsfaktoren der Persona.", "Economic Buyer: Person mit Budgethoheit, also Entscheider und Machtpromotor.", "Decision Criteria: Entscheidungskriterien der Persona.", "Decision Process: Ablauf der Entscheidung entlang der Kaufphasen.", "Identify Pain: zugrunde liegendes Problem, also Pain Points und Bedarf.", "Champion: interner Fürsprecher, meist Fach- oder Beziehungspromotor."], p2: ["Die Qualifizierung hängt eng mit dem Festlegungsfortschritt zusammen: Eine zu spät erkannte Chance ist kaum noch zu gewinnen (Backhaus & Voeth, 2014)."]},
{h: "Vertriebsablauf und Value Selling", p: ["Der Ablauf in der Synthese: Chance erkennen und qualifizieren, Buying Center analysieren, Kaufklasse und Phase bestimmen, Personas klären, Selling Center besetzen, rollen- und phasengerecht ansprechen, Abschluss und After-Sales.", "Value Selling übersetzt Produktmerkmale in einen belegten Nutzen für das Kundenunternehmen. Ein belegter Nutzen erleichtert Champion und Economic Buyer die interne Begründung der Investition (Kleinaltenkamp & Saab, 2021)."]}
],
terms: [
["Champion", "Interner Fürsprecher beim Kunden, der das Vorhaben vorantreibt. Bleibt er ohne Unterstützung, muss er die interne Abstimmung allein tragen."],
["Economic Buyer", "Die Person mit Budgethoheit. Im Buying Center entspricht sie dem Entscheider und meist dem Machtpromotor."],
["Account- und Opportunity-Plan", "Arbeitsblatt, das Buying-Center-Analyse, Personas, Phaseneinordnung und MEDDIC-Qualifizierung für eine konkrete Verkaufschance zusammenführt."],
["Merkmal und Nutzen", "Merkmal: Das System hat eine offene Schnittstelle. Nutzen: Sie binden neue Maschinen ohne Eingriff in das ERP an und vermeiden Stillstände."]
],
questions: [
{q: "Was versteht man unter Buyer Enablement?", a: ["Die Bereitstellung von Information und Hilfsmitteln, die den Kunden bei der Bewältigung seiner Kaufaufgaben unterstützen", "Die Schulung des eigenen Vertriebsteams im Produktwissen", "Die Freischaltung von Rabatten für Bestandskunden", "Die Übertragung der Kaufentscheidung an den Einkauf"], why: "Statt weitere Informationen zu liefern, erleichtert der Vertrieb dem Kunden das Kaufen (Gartner, o. J.)."},
{q: "Aus welchen zwei Bausteinen besteht Buyer Enablement nach Toman et al. (2017)?", a: ["Präskriptive Empfehlung und praktische Unterstützung", "Preisnachlass und Zahlungsziel", "Produktdemo und Vertragsentwurf", "Kaltakquise und Nachfassen"], why: "Empfehlungen sagen dem Kunden, was er tun oder lassen sollte. Rechner, Checklisten und Vergleichshilfen helfen bei der Umsetzung."},
{q: "Welches Buyer-Enablement-Angebot passt zur Kaufaufgabe Konsensbildung?", a: ["Argumentationshilfen für die interne Abstimmung im Buying Center", "Diagnose-Checklisten, die das Problem fassbar machen", "Vorlagen für das Lastenheft", "Wirtschaftlichkeitsrechner und Testinstallationen"], why: "Die Konsensbildung gilt als besonders schwierig. Material, das dem Champion die interne Überzeugungsarbeit erleichtert, wirkt hier oft stärker als ein weiteres Verkaufsgespräch."},
{q: "Wofür stehen die vier Buchstaben von BANT?", a: ["Budget, Authority, Need, Timeline", "Buyer, Agent, Network, Target", "Benefit, Advantage, Need, Trust", "Budget, Analysis, Negotiation, Termination"], why: "BANT ist ein einfaches Raster zur Qualifizierung nach Budget, Entscheidungsbefugnis, Bedarf und Zeithorizont."},
{q: "Welcher Rolle aus Modul 2 entspricht der Economic Buyer in MEDDIC?", a: ["Dem Entscheider und Machtpromotor", "Dem Gatekeeper", "Dem Benutzer", "Dem Fachpromotor"], why: "Der Economic Buyer verfügt über die Budgethoheit, wie der Entscheider, der meist auch Machtpromotor ist."},
{q: "Wer ist in MEDDIC der Champion?", a: ["Ein interner Fürsprecher beim Kunden, meist Fach- oder Beziehungspromotor", "Der erfolgreichste Verkäufer im eigenen Team", "Der Anbieter mit dem günstigsten Angebot", "Die externe Beratung des Kunden"], why: "Der Champion treibt das Vorhaben beim Kunden voran. Er ist mit Argumenten und Material zu unterstützen."},
{q: "Mit welchem Baustein der früheren Module ist die MEDDIC-Komponente Decision Process verbunden?", a: ["Mit den Kaufphasen aus Modul 3", "Mit den vier Einflussebenen aus Modul 1", "Mit dem Ideal Customer Profile aus Modul 4", "Mit dem Selling Center aus Modul 2"], why: "Wer den Ablauf der Entscheidung kennt, weiß, in welcher Kaufphase die Verkaufschance steht."},
{q: "Warum hängt die Qualifizierung von Verkaufschancen mit dem Festlegungsfortschritt zusammen?", a: ["Eine zu spät erkannte Chance ist kaum noch zu gewinnen", "Weil Qualifizierung erst nach Vertragsabschluss erfolgt", "Weil der Festlegungsfortschritt nur im reinen Wiederkauf gilt", "Weil Qualifizierung den Festlegungsfortschritt beim Kunden aufhebt"], why: "Mit jeder Phase verengt sich der Anbieterkreis. Frühe Qualifizierung lenkt die Ressourcen auf Chancen, die noch beeinflussbar sind."},
{q: "Welche Aussage ist nutzenorientiert im Sinne des Value Selling?", a: ["Sie binden neue Maschinen ohne Eingriff in das ERP an und vermeiden Stillstände.", "Das System hat eine offene Schnittstelle.", "Wir bieten Support rund um die Uhr.", "Das MES erfasst alle Maschinendaten."], why: "Value Selling übersetzt Merkmale in einen konkreten Nutzen für das Kundenunternehmen. Die übrigen Aussagen beschreiben Merkmale."},
{q: "Was passiert, wenn der Vertrieb das Buying Center kennt, die aktuelle Kaufphase aber nicht?", a: ["Er spricht die richtigen Personen zur falschen Zeit an", "Er liefert den richtigen Personen die richtigen Argumente", "Er kann die Kaufklasse nicht mehr bestimmen", "Er verliert den Zugang zum Gatekeeper"], why: "Erst das Zusammenspiel von Rollen, Phasen und Motiven trägt. Ohne Phasenwissen stimmt der Zeitpunkt der Ansprache nicht."}
]
}
],
kern: [
"Organisationen kaufen kollektiv, formalisiert und über längere Zeiträume. Das Modell von Webster und Wind erklärt diese Entscheidungen über vier Einflussebenen.",
"Das Buying Center ist ein Rollenkonzept. Das Promotorenmodell ergänzt es um die Frage, wer den Kauf intern vorantreibt.",
"Das Buygrid verbindet Kaufklassen und Kaufphasen. Mit jeder Phase verengt sich der Anbieterkreis, ein früher Einstieg ist daher entscheidend.",
"Buying Personas beruhen auf Daten, vor allem auf Interviews entlang der Five Rings, und legen den Schwerpunkt auf Motive.",
"Buyer Enablement, BANT, MEDDIC und Value Selling überführen die Analyse in konkrete Vertriebsarbeit."
]
};

function seededOrder(n, seed) {
  var idx = [], i, s = seed;
  for (i = 0; i < n; i++) idx.push(i);
  for (i = n - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    var j = Math.floor((s / 233280) * (i + 1));
    var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
  }
  return idx;
}

});
PAGES.push({key: "end", label: "Abschluss"});

var state = {page: 0, answers: {}};

function load() {
  try {
    var raw = window.localStorage.getItem(STORE_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && typeof s.page === "number" && s.answers) state = s;
      if (state.page < 0 || state.page >= PAGES.length) state.page = 0;
    }
  } catch (e) {}
}
function save() {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function modStats(m) {
  var answered = 0, right = 0;
  m.questions.forEach(function (q) {
    if (q.id in state.answers) { answered++; if (state.answers[q.id] === q.c) right++; }
  });
  return {answered: answered, right: right, total: m.questions.length};
}
function totalStats() {
  var a = 0, r = 0;
  QUESTIONS.forEach(function (q) {
    if (q.id in state.answers) { a++; if (state.answers[q.id] === q.c) r++; }
  });
  return {answered: a, right: r, total: QUESTIONS.length};
}

function renderNav() {
  var h = "<ol>";
  PAGES.forEach(function (p, i) {
    if (p.type === "stoff") h += "<li class='grp'>Modul " + p.mod.nr + "</li>";
    var cnt = "";
    if (p.type === "fragen") { var st = modStats(p.mod); cnt = "<span class='cnt'>" + st.answered + "/" + st.total + "</span>"; }
    var lab = p.type === "stoff" ? "Kernstoff" : p.type === "fragen" ? "Kontrollfragen" : p.label;
    h += "<li><button type='button' data-go='" + i + "' class='" + (i === state.page ? "active" : "") + "' title='" + esc(p.label) + "'><span>" + esc(window.innerWidth <= 860 && p.mod ? p.label : lab) + "</span>" + cnt + "</button></li>";
  });
  return h + "</ol>";
}

function navRow() {
  var prev = state.page > 0 ? "<button type='button' class='btn ghost' data-go='" + (state.page - 1) + "'>Zurück</button>" : "<span></span>";
  var next = state.page < PAGES.length - 1 ? "<button type='button' class='btn' data-go='" + (state.page + 1) + "'>Weiter</button>" : "<span></span>";
  return "<div class='navrow'>" + prev + next + "</div>";
}

function renderStart() {
  var h = "<div class='card'><p class='kicker'>Selbstlerntool</p><h1>Buying Center und Buying Persona</h1>";
  h += "<p class='lead'>Dieses Lerntool begleitet Sie durch die fünf Module des Themenblocks. Jedes Modul besteht aus einer kompakten Zusammenfassung des Kernstoffs und zehn Kontrollfragen mit Begründung.</p>";
  h += "<div class='modlist'>";
  DATA.modules.forEach(function (m) { h += "<div><b>Modul " + m.nr + "</b>" + esc(m.title) + "</div>"; });
  h += "</div>";
  h += "<h2>So arbeiten Sie mit dem Tool</h2><ul class='txt'><li>Lesen Sie zuerst den Kernstoff eines Moduls. Begriffe lassen sich dort aufklappen.</li><li>Beantworten Sie danach die Kontrollfragen. Nach jeder Antwort erscheinen die Auflösung und eine kurze Begründung.</li><li>Ihr Fortschritt wird in diesem Browser auf diesem Gerät gespeichert. Mit „Zurücksetzen“ oben rechts beginnen Sie jederzeit von vorne.</li></ul>";
  h += "<p class='note'>Das Tool ersetzt die Modulunterlagen nicht. Es dient der Wiederholung und der Selbstüberprüfung vor der Prüfung.</p>";
  return h + navRow() + "</div>";
}

function paras(arr) { var h = ""; (arr || []).forEach(function (t) { h += "<p>" + esc(t) + "</p>"; }); return h; }

function renderStoff(m) {
  var h = "<div class='card'><p class='kicker'>Modul " + m.nr + " · Kernstoff</p><h1>" + esc(m.title) + "</h1><p class='lead'>" + esc(m.lead) + "</p>";
  m.blocks.forEach(function (b) {
    h += "<h2>" + esc(b.h) + "</h2>" + paras(b.p);
    if (b.list) { h += "<ul class='txt'>"; b.list.forEach(function (li) { h += "<li>" + esc(li) + "</li>"; }); h += "</ul>"; }
    h += paras(b.p2);
  });
  h += "<h2>Begriffe zum Aufklappen</h2>";
  m.terms.forEach(function (t) { h += "<details><summary>" + esc(t[0]) + "</summary><div class='dd'>" + esc(t[1]) + "</div></details>"; });
  return h + navRow() + "</div>";
}

function renderFragen(m) {
  var st = modStats(m);
  var h = "<div class='card'><p class='kicker'>Modul " + m.nr + " · Kontrollfragen</p><h1>" + esc(m.title) + "</h1>";
  h += "<p class='lead'>Beantwortet: " + st.answered + " von " + st.total + " · richtig: " + st.right + "</p>";
  m.questions.forEach(function (q, qi) {
    var chosen = (q.id in state.answers) ? state.answers[q.id] : null;
    h += "<div class='q'><div class='qn'>Frage " + (qi + 1) + " von " + m.questions.length + "</div><div class='qt'>" + esc(q.q) + "</div>";
    q.order.forEach(function (orig, pos) {
      var cls = "opt";
      if (chosen !== null) { if (orig === q.c) cls += " correct"; else if (orig === chosen) cls += " wrong"; }
      h += "<button type='button' class='" + cls + "' data-q='" + q.id + "' data-a='" + orig + "'" + (chosen !== null ? " disabled" : "") + "><span class='l'>" + LETTERS[pos] + "</span>" + esc(q.a[orig]) + "</button>";
    });
    if (chosen !== null) {
      var ok = chosen === q.c;
      h += "<div class='fb" + (ok ? "" : " no") + "'><b>" + (ok ? "Richtig." : "Nicht ganz. Richtig ist Antwort " + LETTERS[q.order.indexOf(q.c)] + ".") + "</b>" + esc(q.why) + "</div>";
    }
    h += "</div>";
  });
  return h + navRow() + "</div>";
}

function renderEnd() {
  var t = totalStats();
  var pct = t.answered ? Math.round((t.right / t.total) * 100) : 0;
  var h = "<div class='card'><p class='kicker'>Abschluss</p><h1>Ihr Ergebnis</h1>";
  h += "<div class='score'><div class='box'><div class='big'>" + t.right + " / " + t.total + "</div><div class='sm'>richtig beantwortet (" + pct + " %)</div></div><div class='box'><div class='big'>" + t.answered + " / " + t.total + "</div><div class='sm'>Fragen bearbeitet</div></div></div>";
  h += "<div class='modlist'>";
  DATA.modules.forEach(function (m) { var s = modStats(m); h += "<div><b>Modul " + m.nr + ": " + s.right + " / " + s.total + "</b>" + esc(m.title) + "</div>"; });
  h += "</div>";
  if (t.answered < t.total) h += "<p class='note'>Es sind noch " + (t.total - t.answered) + " Fragen offen. Über die Navigation gelangen Sie direkt zu den Kontrollfragen der einzelnen Module.</p>";
  h += "<h2>Kernaussagen des Themenblocks</h2><ul class='txt'>";
  DATA.kern.forEach(function (k) { h += "<li>" + esc(k) + "</li>"; });
  h += "</ul>";
  return h + navRow() + "</div>";
}

function render() {
  var p = PAGES[state.page];
  var main = document.getElementById("main");
  var html;
  if (p.key === "start") html = renderStart();
  else if (p.key === "end") html = renderEnd();
  else if (p.type === "stoff") html = renderStoff(p.mod);
  else html = renderFragen(p.mod);
  main.innerHTML = html;
  document.getElementById("nav").innerHTML = renderNav();
  var t = totalStats();
  document.getElementById("pbar").style.width = Math.round((t.answered / t.total) * 100) + "%";
  document.getElementById("hdrstat").textContent = "Fortschritt: " + t.answered + " von " + t.total + " Fragen";
}

function go(i) {
  state.page = Math.max(0, Math.min(PAGES.length - 1, i));
  save(); render();
  try { window.scrollTo(0, 0); } catch (e) {}
}

function onClick(e) {
  var el = e.target;
  while (el && el !== document.body && !(el.getAttribute && (el.getAttribute("data-go") !== null || el.getAttribute("data-q") !== null))) el = el.parentNode;
  if (!el || el === document.body || !el.getAttribute) return;
  var g = el.getAttribute("data-go");
  if (g !== null) { go(parseInt(g, 10)); return; }
  var qid = el.getAttribute("data-q");
  if (qid !== null && !(qid in state.answers)) {
    state.answers[qid] = parseInt(el.getAttribute("data-a"), 10);
    save();
    var y = window.pageYOffset || 0;
    render();
    try { window.scrollTo(0, y); } catch (e2) {}
  }
}

function reset() {
  if (window.confirm && !window.confirm("Alle Antworten löschen und von vorne beginnen?")) return;
  state = {page: 0, answers: {}};
  try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}
  render();
  try { window.scrollTo(0, 0); } catch (e) {}
}

load();
document.addEventListener("click", onClick);
document.getElementById("resetBtn").addEventListener("click", reset);
window.addEventListener("resize", function () { document.getElementById("nav").innerHTML = renderNav(); });
render();
</script>
</body>
</html>
